[workspace]
members = ["crates/fulgur-core", "crates/fulgur-pipeline", "crates/fulgur-catalog", "crates/fulgur-cli", "crates/fulgur-gpu", "crates/fulgur-gui", "crates/fulgur-solve"]
resolver = "3"
default-members = ["crates/fulgur-cli"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode"] }
roxmltree = "0.21.2"
ureq = "2.12"
windows-sys = "0.61"

[profile.release]
lto = "thin"
codegen-units = 1
