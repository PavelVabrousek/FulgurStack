# Manual start only (owner decision of 2026-11-14, ADR-180). The verification
# of record runs on the owner's computer: scripts/test-full.ps1 and
# scripts/test-quick.ps1 (docs/TESTING.md). This workflow may lag behind them
# and never starts on push or pull request.
name: Rust checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Release tests
        run: cargo test --locked --workspace --release --target ${{ matrix.target }}
      - name: Release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: GPU feature warnings
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: GPU feature release tests (hardware gates require explicit local opt-in)
        run: cargo test --locked --workspace --all-features --release --target ${{ matrix.target }}
      - name: GPU feature release build
        run: cargo build --locked --release --features gpu --target ${{ matrix.target }}
      - name: PixInsight import adapter contract tests
        run: node --test scripts/tests/open-fulgurstack.test.cjs
