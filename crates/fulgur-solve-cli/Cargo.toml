[package]
name = "fulgur-solve-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Command line of the blind plate solver: build the index from the Gaia DR3 files, inspect it, and solve frames."

[[bin]]
name = "fulgur-solve"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fulgur-catalog = { path = "../fulgur-catalog" }
fulgur-core = { path = "../fulgur-core" }
fulgur-pipeline = { path = "../fulgur-pipeline" }
fulgur-solve = { path = "../fulgur-solve" }
serde.workspace = true
serde_json.workspace = true
