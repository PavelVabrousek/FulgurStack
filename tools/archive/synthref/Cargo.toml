[package]
name = "synthref"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Separate experiment: plate-solve a registration frame against Gaia DR3 and render a synthetic star reference for FulgurStack."

# A workspace of its own: FulgurStack's workspace, lockfile and build stay unchanged.
[workspace]

[dependencies]
fulgur-core = { path = "../../crates/fulgur-core" }
fulgur-pipeline = { path = "../../crates/fulgur-pipeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

[profile.release]
lto = "thin"
codegen-units = 1
